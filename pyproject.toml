[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "queryshield"
dynamic = ["version"]
description = "Secure, auditable text-to-SQL infrastructure for PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "QueryShield contributors" }]
keywords = [
    "sql",
    "postgresql",
    "security",
    "text-to-sql",
    "llm",
    "governance",
    "audit",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Security",
    "Typing :: Typed",
]

# Runtime dependencies are introduced only in the phase that actually needs
# them (ADR-0014). Phase 1 had none. Phase 2 adds exactly three, for the two
# foundations it delivers — the configuration system and the PostgreSQL adapter:
#   * pydantic  — typed, validated configuration models (ADR-0016)
#   * PyYAML    — optional YAML configuration files (ADR-0017)
#   * psycopg 3 — the async PostgreSQL driver + connection pool (ADR-0018 /
#                 ADR-0019 / ADR-0020). The [binary] extra ships prebuilt
#                 wheels so local and CI installs are reproducible without a
#                 build toolchain; the [pool] extra provides psycopg_pool.
# Phase 3 (schema introspection) introduced no new runtime dependency: it reuses
# the existing psycopg adapter. Phase 4 adds exactly one, for the SQL parsing /
# AST foundation:
#   * pglast    — Python bindings for libpg_query, which is PostgreSQL's *own*
#                 parser (ADR-0003). Using the real grammar eliminates the
#                 parser differential by construction. The declared upper bound
#                 (`<8`) exists so a future major release cannot silently swap
#                 the bundled libpg_query grammar underneath QueryShield.
# No Mistral client, cache, or HTTP dependency yet — those belong to the later
# phases that use them.
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6",
    "psycopg[binary,pool]>=3.2,<4",
    "pglast>=6,<8",
]

[project.optional-dependencies]
# Development/test tooling only. Installed via: pip install -e ".[dev]"
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6",
]

# NOTE:
# - `license` is intentionally omitted: license selection is deferred to the
#   repository owner (ADR-0006). A placeholder license would be misleading.
# - `project.urls` is intentionally omitted: no canonical homepage/repository
#   URL is established yet, and fabricating one would be wrong. Add it once the
#   project has a published home.

# ----------------------------------------------------------------------------
# Build backend: version is the single source of truth in the package __init__.
# ----------------------------------------------------------------------------
[tool.hatch.version]
path = "src/queryshield/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/queryshield"]

# ----------------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
# Phase 2 introduces async code (the PostgreSQL adapter), so tests are async.
# `auto` lets `async def test_*` run without a per-test marker; the fixture loop
# scope is pinned to silence pytest-asyncio's "unset default" deprecation.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, isolated unit tests (the default in Phase 1)",
    "integration: requires external services such as a real PostgreSQL (Phase 2+)",
    "security: security-focused tests (adversarial inputs, deny paths)",
    "property: property-based tests",
    "e2e: full end-to-end pipeline tests",
    "performance: performance / benchmark tests",
]

[tool.coverage.run]
source = ["queryshield"]
branch = true

[tool.coverage.report]
show_missing = true

# ----------------------------------------------------------------------------
# Lint & format (Ruff)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["queryshield"]

# ----------------------------------------------------------------------------
# Type checking (mypy, strict)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
# The pydantic plugin teaches mypy about validated models: it types the
# generated model __init__ so constructing a config with the wrong field type
# is a type error, not a runtime surprise.
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Make the pydantic plugin strict: typed, extra-forbidding __init__ signatures
# so model misuse is caught at type-check time.
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
