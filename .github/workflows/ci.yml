name: CI

# Phase 2 CI: two jobs.
#   * quality     — install the package and run the full quality gate (lint,
#                   format check, strict type check, and the non-integration
#                   tests) across every supported Python version.
#   * integration — run the PostgreSQL integration tests against an ephemeral
#                   `postgres` service container, so the run is reproducible and
#                   never depends on anyone's personal database.
# There is deliberately NO Mistral API key anywhere: the LLM is not part of this
# phase, and the default test run never makes paid calls.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy --strict)
        run: mypy

      - name: Unit tests (pytest, excluding integration)
        run: pytest -m "not integration"

  integration:
    name: integration (PostgreSQL)
    runs-on: ubuntu-latest

    # Disposable PostgreSQL for the run. Credentials are test-only and local to
    # the runner; they are NOT secrets and never touch a real database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: queryshield_test
          POSTGRES_PASSWORD: queryshield_test
          POSTGRES_DB: queryshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queryshield_test -d queryshield_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Integration tests (pytest, PostgreSQL)
        env:
          # Points at the service container above. localhost works because the
          # service port is published to the runner.
          QUERYSHIELD_TEST_DATABASE_URL: postgresql://queryshield_test:queryshield_test@localhost:5432/queryshield_test
        run: pytest -m integration
